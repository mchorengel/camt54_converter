<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>camt.054 → CSV Converter</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #616e7c;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #d9dde2;
      --error-bg: #fee2e2;
      --error-text: #991b1b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
      padding: 2rem;
      max-width: 560px;
      width: 100%;
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.5rem;
    }
    p.lead {
      margin: 0 0 1.5rem;
      color: var(--muted);
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    input[type="file"] {
      display: block;
      width: 100%;
      padding: 0.75rem;
      border: 1px dashed var(--border);
      border-radius: 8px;
      background: #fafbfc;
      margin-bottom: 1rem;
    }
    .row { display: flex; gap: 1rem; align-items: end; margin-bottom: 1.5rem; }
    .row > div { flex: 1; }
    select {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 1rem;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: var(--accent-hover); }
    .error {
      background: var(--error-bg);
      color: var(--error-text);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .hint {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 1.5rem;
      line-height: 1.5;
    }
    code {
      background: #eef0f3;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      font-size: 0.85em;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>camt.054 → CSV</h1>
    <p class="lead">Lade eine oder mehrere camt.054 XML-Dateien hoch und erhalte eine CSV-Datei zurück.</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form action="/convert" method="post" enctype="multipart/form-data">
      <label for="file">camt.054 XML-Datei(en)</label>
      <input id="file" type="file" name="file" accept=".xml,application/xml,text/xml" multiple required />

      <div class="row">
        <div>
          <label for="delimiter">Trennzeichen</label>
          <select id="delimiter" name="delimiter">
            <option value=";" selected>Semikolon ( ; )</option>
            <option value=",">Komma ( , )</option>
            <option value="&#9;">Tab</option>
            <option value="|">Pipe ( | )</option>
          </select>
        </div>
      </div>

      <button type="submit">In CSV umwandeln und herunterladen</button>
    </form>

    <div class="hint">
      Auch als Kommandozeilen-Tool nutzbar:
      <code>python -m camt54_converter.cli datei.xml -o ausgabe.csv</code>
    </div>
  </main>
</body>
</html>
